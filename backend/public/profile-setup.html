<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile — Smart Resume Ranker</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height:100vh;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;padding:32px 16px;">
  <div style="width:100%;max-width:640px;">
    <div class="card" style="padding:36px;">
      <div style="text-align:center;margin-bottom:28px;">
        <div class="brand-icon" style="margin:0 auto 14px;">SR</div>
        <h1 style="font-size:24px;margin-bottom:8px;">Complete Your Profile</h1>
        <p style="color:var(--text-secondary);font-size:14px;">
          Personalize your account to tailor resume analysis and interview questions to your career path.
        </p>
      </div>

      <form id="profile-setup-form">
        <!-- Required: Full Name -->
        <div class="form-group">
          <label class="form-label" for="setup-fullname">Full Name <span class="required">*</span></label>
          <input type="text" id="setup-fullname" class="form-control" placeholder="e.g. Alex Sharma" required>
        </div>

        <div class="grid-cols-2">
          <!-- Designation -->
          <div class="form-group">
            <label class="form-label" for="setup-designation">Designation <span style="font-weight:normal;color:var(--text-muted);">(Optional)</span></label>
            <input type="text" id="setup-designation" class="form-control" placeholder="e.g. Frontend Developer / Fresher">
          </div>
          <!-- Phone Number -->
          <div class="form-group">
            <label class="form-label" for="setup-phone">Phone Number <span style="font-weight:normal;color:var(--text-muted);">(Optional)</span></label>
            <input type="tel" id="setup-phone" class="form-control" placeholder="+91 98765 43210">
          </div>
        </div>

        <!-- Address / Location -->
        <div class="form-group">
          <label class="form-label" for="setup-address">Address / City <span style="font-weight:normal;color:var(--text-muted);">(Optional)</span></label>
          <input type="text" id="setup-address" class="form-control" placeholder="e.g. Bengaluru, Karnataka, India">
        </div>

        <div class="grid-cols-3">
          <!-- GitHub URL -->
          <div class="form-group">
            <label class="form-label" for="setup-github">GitHub URL <span style="font-weight:normal;color:var(--text-muted);">(Optional)</span></label>
            <input type="url" id="setup-github" class="form-control" placeholder="https://github.com/...">
          </div>
          <!-- LinkedIn URL -->
          <div class="form-group">
            <label class="form-label" for="setup-linkedin">LinkedIn URL <span style="font-weight:normal;color:var(--text-muted);">(Optional)</span></label>
            <input type="url" id="setup-linkedin" class="form-control" placeholder="https://linkedin.com/in/...">
          </div>
          <!-- Portfolio URL -->
          <div class="form-group">
            <label class="form-label" for="setup-portfolio">Portfolio URL <span style="font-weight:normal;color:var(--text-muted);">(Optional)</span></label>
            <input type="url" id="setup-portfolio" class="form-control" placeholder="https://portfolio.dev">
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;border-top:1px solid var(--border-color);padding-top:20px;">
          <button type="button" id="btn-skip-setup" class="btn btn-secondary">
            Skip for Now
          </button>
          <button type="submit" id="btn-save-setup" class="btn btn-primary btn-lg">
            Save & Continue ➔
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Preload existing user info if available
      try {
        const u = JSON.parse(localStorage.getItem('srr_user') || '{}');
        if (u.name) {
          document.getElementById('setup-fullname').value = u.name;
        }
      } catch (e) {}

      const form = document.getElementById('profile-setup-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('btn-save-setup');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span> Saving...';

        const payload = {
          fullName: document.getElementById('setup-fullname').value.trim(),
          designation: document.getElementById('setup-designation').value.trim(),
          phone: document.getElementById('setup-phone').value.trim(),
          address: document.getElementById('setup-address').value.trim(),
          githubUrl: document.getElementById('setup-github').value.trim(),
          linkedinUrl: document.getElementById('setup-linkedin').value.trim(),
          portfolioUrl: document.getElementById('setup-portfolio').value.trim(),
          profileCompleted: true
        };

        try {
          await apiRequest('/user/profile', {
            method: 'PUT',
            body: JSON.stringify(payload)
          });
          showToast('Profile completed successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } catch (err) {
          showToast('Failed to save profile: ' + err.message, 'error');
          saveBtn.disabled = false;
          saveBtn.innerHTML = 'Save & Continue ➔';
        }
      });

      document.getElementById('btn-skip-setup').addEventListener('click', () => {
        window.location.href = 'dashboard.html';
      });
    });
  </script>
</body>
</html>
