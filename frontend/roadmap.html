<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Roadmaps — Smart Resume Ranker</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .roadmap-role-tab {
      padding: 10px 18px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .roadmap-role-tab:hover {
      border-color: var(--accent-primary);
    }
    .roadmap-role-tab.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      box-shadow: 0 4px 10px rgba(37,99,235,0.3);
    }
    .topic-card {
      margin-bottom: 20px;
      border-left: 4px solid var(--accent-primary);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-nav-toggle" id="btn-mobile-nav" aria-label="Toggle navigation">☰</button>
          <h2 class="topbar-page-title">Learning Roadmaps</h2>
        </div>
        <div class="topbar-right">
          <button class="btn-theme-toggle" id="btn-theme-toggle">🌙 <span class="toggle-text">Dark Mode</span></button>
        </div>
      </header>

      <div class="content-body">
        <!-- Role Selection Tabs -->
        <div class="card" style="margin-bottom:24px;padding:20px;">
          <h3 style="font-size:15px;margin-bottom:12px;">Select Career Track:</h3>
          <div style="display:flex;flex-wrap:wrap;gap:10px;">
            <button class="roadmap-role-tab active" data-role="frontend">Frontend Developer</button>
            <button class="roadmap-role-tab" data-role="backend">Backend Developer</button>
            <button class="roadmap-role-tab" data-role="fullstack">Full Stack Developer</button>
            <button class="roadmap-role-tab" data-role="ml-engineer">Machine Learning Engineer</button>
            <button class="roadmap-role-tab" data-role="devops">DevOps & SRE</button>
            <button class="roadmap-role-tab" data-role="cybersecurity">Cybersecurity</button>
          </div>
        </div>

        <!-- Roadmap Header & Progress Card -->
        <div class="card" style="padding:28px;margin-bottom:24px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:16px;">
            <div>
              <span class="badge badge-primary" style="margin-bottom:6px;">Curriculum Path</span>
              <h1 id="roadmap-title" style="font-size:24px;margin-bottom:6px;">Frontend Developer Roadmap</h1>
              <p id="roadmap-desc" style="color:var(--text-secondary);font-size:14px;max-width:700px;">Step by step guide to becoming a modern frontend developer.</p>
            </div>
            <div style="text-align:right;">
              <div id="roadmap-progress-percentage" style="font-size:18px;font-weight:800;color:var(--accent-primary);margin-bottom:6px;">0% Completed</div>
              <div style="width:180px;height:8px;background:var(--bg-tertiary);border-radius:4px;overflow:hidden;">
                <div id="roadmap-progress-bar" style="height:100%;width:0%;background:var(--accent-primary);transition:width 0.3s ease;"></div>
              </div>
            </div>
          </div>

          <!-- Prerequisites -->
          <div style="border-top:1px solid var(--border-color);padding-top:14px;margin-top:14px;">
            <strong style="font-size:13px;text-transform:uppercase;color:var(--text-muted);">Prerequisites:</strong>
            <ul id="roadmap-prerequisites" style="padding-left:20px;font-size:13px;color:var(--text-secondary);margin-top:6px;"></ul>
          </div>
        </div>

        <!-- Topics List Container -->
        <div id="roadmap-topics-container"></div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/roadmap.js"></script>
</body>
</html>
